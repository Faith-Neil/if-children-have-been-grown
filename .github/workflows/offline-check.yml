# 为什么有这个文件：在合作分支的推送和拉取请求上重复离线检查。
# 它解决什么问题：后台测试、页面构建与函数测试、治理检查不再只依赖某一台开发机。
name: offline-check

on:
  push:
    branches:
      - codex/repository-foundation
  pull_request:
    branches:
      - codex/repository-foundation

permissions:
  contents: read

concurrency:
  group: offline-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: backend/bid-core/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/bid-core/requirements.txt
      - name: Pytest
        run: python -m pytest tests/backend -q
      - name: Live session HTTP
        run: python tests/backend/session_live_http.py
      - name: Error and idempotency live HTTP
        run: |
          mkdir -p frontend/web/dist/assets
          printf '%s\n' '<!doctype html><title>ci</title>' > frontend/web/dist/index.html
          python tests/backend/qa_error_idempotency_live_http.py
      - name: T06 end-to-end smoke
        working-directory: backend/bid-core
        run: python smoke_t06.py

  backend-mysql:
    name: backend-mysql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: backend/bid-core/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/bid-core/requirements.txt
      - name: Generate runtime database password
        run: |
          set +x
          umask 077
          password="$(openssl rand -hex 24)"
          test "${#password}" -eq 48
          echo "::add-mask::${password}"
          secret_dir="${RUNNER_TEMP}/mysql-secret"
          mkdir -p "${secret_dir}"
          printf '%s' "${password}" > "${secret_dir}/root-password"
          printf '%s\n' '[client]' 'user=root' "password=${password}" > "${secret_dir}/client.cnf"
          chmod 644 "${secret_dir}/root-password" "${secret_dir}/client.cnf"
          {
            echo "ICG_REQUIRE_MYSQL=1"
            echo "MYSQL_SECRET_DIR=${secret_dir}"
            echo "ICG_DATABASE_URL<<END_URL"
            printf 'mysql+pymysql://root:%s@127.0.0.1:3306/icg_demo?charset=utf8mb4\n' "${password}"
            echo "END_URL"
          } >> "${GITHUB_ENV}"
      - name: Start MySQL 8.4
        run: |
          set +x
          docker run -d --name icg-mysql \
            -p 127.0.0.1:3306:3306 \
            -v "${MYSQL_SECRET_DIR}/root-password:/run/secrets/mysql-root:ro" \
            -v "${MYSQL_SECRET_DIR}/client.cnf:/run/secrets/client.cnf:ro" \
            -e MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql-root \
            -e MYSQL_DATABASE=icg_demo \
            --health-cmd='mysqladmin --defaults-extra-file=/run/secrets/client.cnf ping --silent' \
            --health-interval=5s \
            --health-timeout=5s \
            --health-start-period=20s \
            --health-retries=30 \
            mysql:8.4 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci
          ready=0
          for _ in $(seq 1 40); do
            # The image answers a health probe from its temporary init server, then
            # restarts. Wait until that init has finished and a real ping succeeds.
            if docker logs icg-mysql 2>&1 | grep -q "MySQL init process done" \
              && docker exec icg-mysql mysqladmin --defaults-extra-file=/run/secrets/client.cnf ping --silent; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "${ready}" != "1" ]; then
            echo "MySQL did not become ready"
            exit 1
          fi
          docker exec icg-mysql mysql --defaults-extra-file=/run/secrets/client.cnf \
            -e "CREATE DATABASE IF NOT EXISTS icg_demo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          charset_row="$(docker exec icg-mysql mysql --defaults-extra-file=/run/secrets/client.cnf -N -e "SELECT DEFAULT_CHARACTER_SET_NAME, DEFAULT_COLLATION_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='icg_demo'")"
          echo "icg_demo charset collation: ${charset_row}"
          test "${charset_row}" = "utf8mb4	utf8mb4_unicode_ci"
      - name: Alembic upgrade
        run: alembic -c backend/bid-core/alembic.ini upgrade head
      - name: MySQL pytest
        id: mysql-pytest
        run: python -m pytest tests/backend -m mysql --junitxml=mysql-junit.xml -q
      - name: Require collected MySQL tests
        if: always() && steps.mysql-pytest.conclusion != 'skipped'
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("mysql-junit.xml")
          if not path.is_file():
              print("mysql junit file is missing")
              sys.exit(1)
          root = ET.parse(path).getroot()
          suites = list(root.findall("testsuite")) if root.tag == "testsuites" else [root]
          tests = skipped = failures = errors = 0
          for suite in suites:
              tests += int(suite.attrib.get("tests", "0"))
              skipped += int(suite.attrib.get("skipped", "0"))
              failures += int(suite.attrib.get("failures", "0"))
              errors += int(suite.attrib.get("errors", "0"))
          print(f"mysql junit tests={tests} skipped={skipped} failures={failures} errors={errors}")
          if tests == 0 or skipped > 0 or failures or errors:
              sys.exit(1)
          PY

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.9.0"
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        working-directory: frontend/web
        run: pnpm build
      - name: Frontend tests
        run: node --test tests/frontend/*.test.mjs frontend/web/tests/*.test.mjs

  governance:
    name: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.9.0"
      - name: CommonJS suites
        run: node --test tests/governance/*.test.cjs tests/prototype/*.test.cjs tests/workspace-sync/*.test.cjs tests/backend/demo-page.test.cjs
      - name: Governance check
        run: node scripts/check-project-governance.cjs

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: backend/bid-core/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/bid-core/requirements.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.9.0"
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend/web
        run: pnpm install --frozen-lockfile
      - name: Playwright version from lockfile
        id: playwright-version
        run: |
          version=$(grep -m1 -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' frontend/web/pnpm-lock.yaml | head -n1 | sed 's/.*@//')
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        run: pnpm --dir frontend/web exec playwright install --with-deps chromium
      - name: Browser end-to-end
        env:
          E2E_PYTHON: python
          E2E_SCREENSHOT_DIR: ${{ github.workspace }}/e2e-artifacts/screenshots
          E2E_OUTPUT_DIR: ${{ github.workspace }}/e2e-artifacts/results
          PLAYWRIGHT_HTML_REPORT: ${{ github.workspace }}/e2e-artifacts/report
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm --dir frontend/web e2e -- --trace=on --video=on --reporter=list --reporter=html
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          retention-days: 14
          if-no-files-found: warn
          path: e2e-artifacts
