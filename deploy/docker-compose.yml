# 为什么有这个文件：固化应用服务器上的单 worker 生产运行方式。
# 它解决什么问题：应用容器只连接公司内网已有的 MySQL 服务器和 RAGFlow 服务器，不把数据库混布在应用机，也不依赖系统代理。
name: icg
services:
  icg:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ICG_DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-icg}?charset=utf8mb4
      ICG_REQUIRE_MYSQL: "1"
      ICG_ENV: production
      ICG_ALLOW_DEMO_LOGIN: "0"
      ICG_SECRET_KEY: ${ICG_SECRET_KEY:?set ICG_SECRET_KEY in deploy/.env}
      ICG_ADMIN_INITIAL_PASSWORD: ${ICG_ADMIN_INITIAL_PASSWORD:?set ICG_ADMIN_INITIAL_PASSWORD in deploy/.env}
      ICG_SECTION_CONCURRENCY: ${ICG_SECTION_CONCURRENCY:-2}
      ICG_RAGFLOW_BASE_URL: ${ICG_RAGFLOW_BASE_URL:?set ICG_RAGFLOW_BASE_URL in deploy/.env}
      ICG_RAGFLOW_API_KEY: ${ICG_RAGFLOW_API_KEY:?set ICG_RAGFLOW_API_KEY in deploy/.env}
      ICG_RAGFLOW_TIMEOUT_SECONDS: ${ICG_RAGFLOW_TIMEOUT_SECONDS:-30}
    ports:
      # 安全默认：只绑定回环地址，明文 HTTP 不暴露到任何网卡；
      # 对外访问须经宿主机反向代理（Nginx/Caddy）以 HTTPS 终止后转发到 127.0.0.1:8710，
      # 详见 deploy/README.md 第 3 节。确需局域网直连时再用 ICG_BIND_HOST 显式放开。
      - "${ICG_BIND_HOST:-127.0.0.1}:8710:8710"
    healthcheck:
      # 健康端点是 /health（/api/v1 下没有健康路由）；persistent 为 true 才代表
      # MySQL 生产持久化真正生效，避免把内存态误判为健康。
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8710/health', timeout=5)); sys.exit(0 if d.get('status')=='ok' and d.get('persistent') else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 12
